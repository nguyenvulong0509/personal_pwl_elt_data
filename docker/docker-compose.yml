x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - PYTHONPATH=/opt/airflow
    - _PIP_ADDITIONAL_REQUIREMENTS=/opt/airflow
  volumes:
    - ${PROJECT_ROOT}:/opt/airflow
  networks:
    - lakehouse_net
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse_net

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ${PROJECT_ROOT}/data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - lakehouse_net

  airflow-webserver:
    <<: *airflow-common
    command: >
      bash -c "airflow db init && 
      airflow users create --username ${AIRFLOW_UI_USER} --password ${AIRFLOW_UI_PASSWORD} 
      --firstname vulong --lastname nguyen --role Admin --email ${AIRFLOW_UI_EMAIL} && 
      airflow webserver"
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  # --- SPARK COMPUTATION LAYER (Custom Image) ---
  spark:
    build: 
      context: .
      dockerfile: Dockerfile
    user: root
    environment:
      - SPARK_MASTER_WEBUI_PORT=8081
      - SPARK_MODE=master
      - PYTHONPATH=/opt/airflow
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "${SPARK_MASTER_UI_PORT}:8081"
      - "${SPARK_THRIFT_PORT}:10000"
      - "7077:7077"
    volumes:
      - ${PROJECT_ROOT}:/opt/airflow
      # 👇 MOUNT THE SPARK DEFAULTS CONFIGURATION FILE
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - lakehouse_net
    depends_on:
      rest-catalog:
        condition: service_started

  spark-worker:
    build: 
      context: .
      dockerfile: Dockerfile
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
      - PYTHONPATH=/opt/airflow
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    volumes:
      - ${PROJECT_ROOT}:/opt/airflow
      # 👇 WORKERS MUST READ THE SAME FILE TO SYNC EXTENSIONS
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - lakehouse_net
    depends_on:
      spark:
        condition: service_started
      rest-catalog:
        condition: service_started

  # --- Apache Iceberg Ecosystem ---
  rest-catalog:
    image: tabulario/iceberg-rest:0.6.0
    ports:
      - "8182:8181" 
    environment:
      - CATALOG_WAREHOUSE=s3a://lakehouse/warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_CATALOG__IMPL=org.apache.iceberg.jdbc.JdbcCatalog
      - CATALOG_URI=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - CATALOG_JDBC_USER=${POSTGRES_USER}
      - CATALOG_JDBC_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - lakehouse_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  lakehouse_net:
    driver: bridge

volumes:
  postgres_data: