[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powerlifting_pipeline"
version = "0.1.0"
description = "Powerlifting ELT Lakehouse"
# Add this block to track your project's requirements!
dependencies = [
    "requests==2.33.1",
    "psycopg2-binary==2.9.12",
    "boto3",
    "tenacity",
    "google-api-python-client==2.195.0",
    "google-auth==2.50.0",
    "google-auth-httplib2==0.3.1",
    "google-auth-oauthlib==1.3.1",
    "uritemplate==4.2.0",
    "python-dotenv==1.2.2",
    "polars==0.20.10",
    "pyarrow==15.0.0",
    "dbt-core==1.11.8",
    "dbt-postgres==1.11.8",
    "python-dateutil==2.9.0.post0",
    "zstandard==0.25.0",
    "cryptography==47.0.0",
    "pydantic==2.13.3",
    "typing_extensions==4.15.0",
    "pyspark==3.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]