version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - PYTHONPATH=/opt/airflow  # keep this so python finds the src/ folder
    - _PIP_ADDITIONAL_REQUIREMENTS=requests psycopg2-binary
  volumes:
    - .:/opt/airflow  # syncs the whole repo into the container
  depends_on:
    postgres:
      condition: service_healthy

services:
  # state tracker & airflow backend
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data # persist history across container restarts

  # local S3 bucket / lakehouse storage
  minio:
    image: minio/minio
    ports:
      - "${MINIO_API_PORT}:9000" # api port for spark
      - "${MINIO_CONSOLE_PORT}:9001" # web UI
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data # maps so downloaded CSVs land directly into our local S3

  # airflow orchestrator
  airflow-webserver:
    <<: *airflow-common
    command: >
      bash -c "airflow db init && 
      airflow users create 
      --username ${AIRFLOW_UI_USER} 
      --password ${AIRFLOW_UI_PASSWORD} 
      --firstname vulong 
      --lastname nguyen 
      --role Admin 
      --email ${AIRFLOW_UI_EMAIL} && 
      airflow webserver"
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080" 
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  # data transformation engine
  spark:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYTHONPATH=/opt/airflow # let spark see the src/ folder too
    ports:
      # Master UI (Check this in browser at localhost:8081)
      - "${SPARK_MASTER_UI_PORT}:8080"   
      # Thrift Server (For future DBeaver/SQL connections)
      - "${SPARK_THRIFT_PORT}:10000" 
    volumes:
      - .:/opt/airflow

volumes:
  postgres_data: